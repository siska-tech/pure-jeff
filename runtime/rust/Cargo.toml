[package]
name = "pure-jeff-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The jeff command (lock, prepare, decide, worker) and development probes for pure-jeff"

[[bin]]
name = "jeff"
path = "src/bin/jeff.rs"

[dependencies]
pure-jeff = { path = "../..", features = ["process"] }
anyhow = "1"
serde_json = "1"

# Used by the development examples (probe, profile, resident_bench, verify_portable).
[dev-dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
# Only to read the cache sizes gemm uses (thread_probe); no features added.
gemm-common = { version = "=0.19.0", default-features = false }
# The gemm Candle already calls, called directly by the gemm_chunk_bench experiment; no features added.
gemm = { version = "=0.19.0", default-features = false, features = ["std", "rayon"] }
# The pool Candle and gemm already use (forward_breakdown --delta experiments); no new crate.
rayon = "=1.12.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

# The pinned Candle revision, as for the library (see docs/crate-release-plan.md).
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a" }
