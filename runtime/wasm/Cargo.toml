[package]
name = "kaze_judge_wasm_probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "W0 browser Wasm feasibility probe for the frozen Native Jeff operators"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kaze_judge = { path = "../.." }
anyhow = "1"
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a", default-features = false }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only to name getrandom::Error in the custom backend; randomness comes from the page.
getrandom = "=0.3.4"

[build-dependencies]
sha2 = "0.10"

[profile.release]
codegen-units = 1
