[package]
name = "pure-jeff-wasm-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "W0-W2 browser Wasm feasibility probe for the frozen Native Jeff operators (research)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The frozen sources in frozen/ name the contract crate `kaze_judge` (its name until 2026-10-12);
# the alias keeps them byte-identical.
kaze_judge = { package = "pure-jeff", path = "../..", default-features = false }
anyhow = "1"
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only to name getrandom::Error in the custom backend; randomness comes from the page.
getrandom = "=0.3.4"

[build-dependencies]
sha2 = "0.10"

[profile.release]
codegen-units = 1

# The pinned Candle revision, as for the library (see docs/crate-release-plan.md).
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a" }
