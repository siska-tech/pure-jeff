[package]
name = "kaze_judge_tract_probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated ONNX importer feasibility probe, not a DecisionProvider"

[dependencies]
anyhow = "1"
tract-onnx = { git = "https://github.com/sonos/tract", rev = "9e0cfaa9b3a9251f41f74101801dc2c937b1660a", default-features = false }
tract-nnef = { git = "https://github.com/sonos/tract", rev = "9e0cfaa9b3a9251f41f74101801dc2c937b1660a", default-features = false }
serde_json = "1"

[profile.release]
debug = 0

[patch."https://github.com/sonos/tract"]
tract-data = { path = "vendor/data" }
