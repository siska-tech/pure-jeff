[package]
name = "kaze_judge"
version = "0.1.0"
edition = "2021"
description = "Local candidate decision contracts for recognition evidence"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
process = ["dep:tempfile"]

[dependencies.tempfile]
version = "3"
optional = true

[[example]]
name = "jeff_decide"
required-features = ["process"]
