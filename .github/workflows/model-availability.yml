name: Model availability
# The web demo and tools/fetch_model.py fetch the pinned checkpoint from a third-party Hugging
# Face repository. This weekly check fails (and notifies the owner) if it disappears or changes.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -B tools/check_model_availability.py
