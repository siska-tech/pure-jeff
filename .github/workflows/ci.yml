name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0
jobs:
  windows:
    # Model-free checks only: the 1.7 GB checkpoint is not downloaded in CI.
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default $env:RUST_TOOLCHAIN
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            runtime/rust/target
            .ci-target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Library (pure-jeff)
        run: |
          $env:PURE_JEFF_PYTHON = (Get-Command python).Source
          # The first start of a fresh interpreter can exceed the process tests' deadlines here.
          & $env:PURE_JEFF_PYTHON -c "import argparse, json, pathlib, time"
          cargo test --locked --all-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-features --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTDOCFLAGS = "-D warnings"
          cargo doc --locked --no-deps --all-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --check
      - name: CLI (runtime/rust)
        run: |
          cargo test --locked --manifest-path runtime/rust/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path runtime/rust/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path runtime/rust/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path runtime/rust/Cargo.toml --bins --examples
      - name: Wasm probe
        run: |
          $env:CARGO_TARGET_DIR = ".ci-target/probe"
          cargo test --locked --manifest-path runtime/wasm/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path runtime/wasm/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path runtime/wasm/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item Env:CARGO_TARGET_DIR
          python -B tools/build_wasm.py probe --target-dir .ci-target/wasm
      - name: Web demo engine
        run: |
          $env:CARGO_TARGET_DIR = ".ci-target/engine"
          cargo test --locked --manifest-path apps/web-demo/engine/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path apps/web-demo/engine/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path apps/web-demo/engine/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item Env:CARGO_TARGET_DIR
          python -B tools/build_wasm.py engine --target-dir .ci-target/wasm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # No host path (home directory, checkout, target) may ship in the engine.
          python -B tools/check_no_host_paths.py .ci-target/wasm/wasm32-unknown-unknown/release/pure_jeff_web_demo.wasm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Outside the cached .ci-target: strip_exports.py never overwrites an existing file.
          $stripped = Join-Path $env:RUNNER_TEMP "engine.wasm"
          python -B apps/web-demo/strip_exports.py .ci-target/wasm/wasm32-unknown-unknown/release/pure_jeff_web_demo.wasm $stripped
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node -e "const m=new WebAssembly.Module(require('fs').readFileSync(process.argv[1]));const e=WebAssembly.Module.exports(m).map(x=>x.name);if(e.some(n=>n.startsWith('kj_')))process.exit(1);console.log(e.join(','))" $stripped
      - name: Python tools (no model)
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest discover -s runtime -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location runtime/wasm
          python -B -m unittest test_run_w0 test_run_w1 test_run_w2
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
          Push-Location apps/web-demo
          python -B -m unittest discover -p "test_*.py"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
          # The benchmark driver samples Windows process memory, so these run on Windows only.
          python -B -m unittest bench/test_bench.py
          exit $LASTEXITCODE
      - name: JavaScript syntax
        run: |
          foreach ($f in @("apps/web-demo/web/app.js", "apps/web-demo/web/i18n.js", "apps/web-demo/web/engine-worker.js", "apps/web-demo/e2e_w3.mjs", "runtime/wasm/web/worker.js", "runtime/wasm/web/w1-worker.js", "runtime/wasm/web/w2-worker.js")) {
            node --check $f
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          node --test apps/web-demo/test_i18n.cjs
      - name: Dependency licenses
        run: |
          # cargo metadata runs offline; fetch every locked package (all platforms) first.
          foreach ($m in @("Cargo.toml", "runtime/rust/Cargo.toml", "runtime/wasm/Cargo.toml", "apps/web-demo/engine/Cargo.toml")) {
            cargo fetch --locked --manifest-path $m
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python -B tools/audit_licenses.py --strict
  linux:
    # The same model-free checks on Linux; the validated runtime target is Windows x86_64.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            runtime/rust/target
            .ci-target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Rust crates
        run: |
          set -e
          export PURE_JEFF_PYTHON="$(command -v python)"
          cargo test --locked --all-features
          cargo clippy --locked --all-features --all-targets -- -D warnings
          cargo test --locked --manifest-path runtime/rust/Cargo.toml
          cargo clippy --locked --manifest-path runtime/rust/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path runtime/rust/Cargo.toml --bins --examples
          CARGO_TARGET_DIR=.ci-target/probe cargo test --locked --manifest-path runtime/wasm/Cargo.toml
          CARGO_TARGET_DIR=.ci-target/engine cargo test --locked --manifest-path apps/web-demo/engine/Cargo.toml
      - name: Wasm builds
        run: |
          set -e
          python -B tools/build_wasm.py probe --target-dir .ci-target/wasm
          python -B tools/build_wasm.py engine --target-dir .ci-target/wasm
          python -B tools/check_no_host_paths.py .ci-target/wasm/wasm32-unknown-unknown/release/pure_jeff_web_demo.wasm
      - name: Python tools (no model)
        run: |
          set -e
          python -m pip install --disable-pip-version-check numpy==2.5.3
          python -B -m unittest discover -s runtime -p "test_*.py"
          (cd runtime/wasm && python -B -m unittest test_run_w0 test_run_w1 test_run_w2)
          (cd apps/web-demo && python -B -m unittest discover -p "test_*.py")
          node --test apps/web-demo/test_i18n.cjs
  package:
    # The crates.io package, built and used by a separate project with dependencies from
    # crates.io only (no repository [patch]); nothing is published. Model-free.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Package and consumer
        shell: bash
        run: python -B tools/check_package.py --work "$RUNNER_TEMP/package-check"
