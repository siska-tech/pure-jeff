name: Rust contracts
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-rust:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Core and native process contracts (no Python or model assets)
        shell: pwsh
        run: |
          cargo test --locked --test contract
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --features process --test native_process
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-features --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --check
          exit $LASTEXITCODE
      - name: Rust runtime fixture contracts (no model assets)
        shell: pwsh
        run: |
          cargo test --locked --manifest-path runtime/rust/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path runtime/rust/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path runtime/rust/Cargo.toml -- --check
          exit $LASTEXITCODE
