[package]
name = "kaze_judge_web_demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser demo engine: resident verified assets and kaze_judge Attempt output"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kaze_judge = { path = "../../.." }
kaze_judge_wasm_probe = { path = "../../../runtime/wasm" }
anyhow = "1"
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
