[package]
name = "pure-jeff-web-demo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Browser demo engine: pure-jeff in-memory sessions and Attempt output over a raw Wasm ABI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pure-jeff = { path = "../../..", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only to name getrandom::Error in the custom backend; randomness comes from the page.
getrandom = "=0.3.4"

[profile.release]
codegen-units = 1

# The pinned Candle revision, as for the library (see docs/crate-release-plan.md).
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a" }
